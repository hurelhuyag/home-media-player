# Key bindings for the kiosk's player, on top of mpv's defaults
# (https://mpv.io/manual/stable/#interactive-control), so `i`, `#`, `j`, `[`,
# `]`, `z`/`x` etc. all work as in mpv. Lines here override the defaults.
#
# The defaults below follow YouTube TV: Up shows the progress bar, Left/Right
# seek, OK pauses, Down shows what's next.
#
# TV remote over HDMI-CEC arrives as: arrows, ENTER (OK), PLAYPAUSE, STOP,
# REWIND, FORWARD, PREV, NEXT, MENU, 0-9, PGUP/PGDWN (channel +/-),
# F5 (blue), F2 (red), F3 (green), F4 (yellow), j (subtitle), i (info).
#
# Back/Esc, Stop and q always close the player and return to the file list;
# binding them here has no effect.

UP          script-message-to osc osc-show
DOWN        script-message-to osc osc-playlist 4
LEFT        seek -10; script-message-to osc osc-show
RIGHT       seek  10; script-message-to osc osc-show
ENTER       cycle pause; script-message-to osc osc-show
PLAYPAUSE   cycle pause; script-message-to osc osc-show
PLAY        cycle pause; script-message-to osc osc-show
PAUSE       cycle pause; script-message-to osc osc-show
REWIND      seek -30; script-message-to osc osc-show
FORWARD     seek  30; script-message-to osc osc-show
PGUP        seek  600; script-message-to osc osc-show
PGDWN       seek -600; script-message-to osc osc-show
PREV        playlist-prev
NEXT        playlist-next
MENU        script-message-to osc osc-tracklist 4

# Color keys
F5          cycle audio
F2          cycle sub
F3          script-binding stats/display-stats-toggle
F4          cycle sub-visibility
