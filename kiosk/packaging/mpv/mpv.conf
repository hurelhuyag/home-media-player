# mpv options for the kiosk's video/music player (libmpv inside the app).
# Same syntax as ~/.config/mpv/mpv.conf: https://mpv.io/manual/stable/#options
#
# Don't set vo, gpu-context or hwdec here: the app owns the video output.
# Hardware decoding is HMP_HWDEC in /etc/default/home-media-player.

# mpv's on-screen controller as a bar at the bottom; Up/Left/Right/OK show it
# (see input.conf)
osc=yes
script-opts=osc-layout=bottombar,osc-hidetimeout=5000,osc-seekbarstyle=bar,osc-vidscale=no,osc-scalewindowed=1.5
# Seeking shows the OSC instead of mpv's bar in the middle of the screen
osd-bar=no

# Big enough to read from the couch
osd-font-size=40
sub-font-size=48

# Pick up movie.srt / movie.en.srt next to the video
sub-auto=fuzzy
slang=mn,en
alang=mn,en

# Surround: mpv decodes everything (Dolby, DTS, AAC, ...) and sends 5.1/7.1
# as multichannel PCM, laid out for what the TV/receiver reports over HDMI.
# Stereo stays stereo, so the receiver's own surround modes still apply.
# Needs the hmp-hdmi-multichannel kernel modules; without them the HC4 only
# carries stereo over HDMI. The HDMI device is used directly because only it
# reports the speaker channel map (ALSA's "default" hides it).
# Bitstream passthrough isn't possible with the mainline HDMI driver.
audio-device=alsa/hw:CARD=ODROIDHC4,DEV=0
audio-channels=auto
