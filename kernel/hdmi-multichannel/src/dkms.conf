PACKAGE_NAME="hmp-hdmi-multichannel"
PACKAGE_VERSION="2"
BUILT_MODULE_NAME[0]="snd-soc-meson-g12a-tohdmitx"
BUILT_MODULE_NAME[1]="snd-soc-meson-card-utils"
# updates/ takes precedence over the kernel's own copies of the modules
DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
# The module sources are from Linux 6.18.43; don't try other kernel series
# (the stock modules stay, with stereo-only HDMI audio).
BUILD_EXCLUSIVE_KERNEL="^6\.18\."
